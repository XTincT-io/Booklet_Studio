version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: booklet
      POSTGRES_PASSWORD: booklet
      POSTGRES_DB: booklet_studio
    ports:
      - "5432:5432"
    volumes:
      - booklet_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - booklet_redisdata:/data

volumes:
  booklet_pgdata:
  booklet_redisdata:
